<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل IPTV الخاص بي</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; }
        video { width: 100%; max-width: 800px; margin-top: 20px; background: black; }
        input { width: 80%; padding: 10px; margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>مشغل قنوات IPTV</h1>
    <input type="text" id="stream-url" placeholder="ضع رابط القناة هنا (ينتهي بـ m3u8)">
    <button onclick="playVideo()">تشغيل القناة</button>
    <br>
    <video id="video" controls></video>

    <script>
        function playVideo() {
            var video = document.getElementById('video');
            var url = document.getElementById('stream-url').value;
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
            }
        }
    </script>
</body>
</html>
