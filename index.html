<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة خدماتك - دليل الحرفيين</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; direction: rtl; text-align: right; }
        .header { background: linear-gradient(135deg, #6200ee, #3700b3); color: white; padding: 25px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .nav-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .nav-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-directory { background-color: white; color: #3700b3; border: 1px solid #3700b3; }
        .btn-register { background-color: #3700b3; color: white; }
        .search-box { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 20px; }
        
        /* بطاقات الحرفيين */
        .artisan-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; position: relative; }
        .badge-city { background: #ede7f6; color: #5e35b1; padding: 4px 10px; border-radius: 12px; font-size: 12px; display: inline-block; margin-bottom: 8px; }
        .artisan-name { font-size: 18px; font-weight: bold; color: #333; margin: 0 0 5px 0; }
        .artisan-craft { color: #666; font-size: 14px; margin-bottom: 12px; }
        .card-actions { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; text-align: center; text-decoration: none; font-size: 14px; font-weight: bold; display: inline-block; }
        .call-btn { background-color: #e3f2fd; color: #1565c0; width: 100%; }

        /* نموذج التسجيل */
        .form-section { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: none; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .submit-btn { background-color: #3700b3; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .loading { text-align: center; color: #666; padding: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>منصة خدماتك</h1>
    <p>البوابة الاحترافية لاكتشاف وطلب أفضل الحرفيين</p>
</div>

<div class="container">
    <!-- أزرار التبديل -->
    <div class="nav-buttons">
        <button class="btn-directory" onclick="showDirectory()">دليل الحرفيين</button>
        <button class="btn-register" onclick="showRegisterForm()">سجل حرفياً جديداً</button>
    </div>

    <!-- قسم نموذج التسجيل -->
    <div id="registerSection" class="form-section">
        <h3 style="margin-top: 0; color: #333; text-align: center;">تسجيل حرفي جديد</h3>
        <form id="registrationForm" action="https://formsubmit.co/ajax/minounaami@gmail.com" method="POST">
            <!-- إعدادات إضافية لترتيب الجدول أو البريد -->
            <input type="hidden" name="_subject" value="تسجيل حرفي جديد في منصة خدماتك">
            <input type="hidden" name="_template" value="table">
            
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" name="name" id="name" required placeholder="مثال: أيمن نعمي">
            </div>
            <div class="form-group">
                <label>التخصص:</label>
                <input type="text" name="craft" id="craft" required placeholder="مثال: بلاكو بلاتر + صباغة">
            </div>
            <div class="form-group">
                <label>المدينة / الولاية:</label>
                <input type="text" name="city" id="city" required placeholder="مثال: بسكرة العالية">
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" name="phone" id="phone" required placeholder="06XXXXXXXX">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">إرسال وتسجيل البيانات</button>
        </form>
    </div>

    <!-- قسم الدليل وعرض الحرفيين -->
    <div id="directorySection">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث بالحرفة أو البلدية (مثال: بلاكو بلاتر، بسكرة)..." onkeyup="filterArtisans()">
        
        <div id="artisansList">
            <div class="loading">جاري تحميل الحرفيين من الجدول...</div>
        </div>
    </div>
</div>

<script>
    const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/1-9DHkXXgWj7QxVfI5gi4jdaZkT6FU-IhVpUn2-ih4xc/export?format=csv';
    let allArtisans = [];

    window.onload = function() {
        fetchArtisans();
    };

    async function fetchArtisans() {
        try {
            const response = await fetch(sheetCSVUrl);
            const data = await response.text();
            parseCSV(data);
        } catch (error) {
            console.error('Error fetching data:', error);
            document.getElementById('artisansList').innerHTML = '<div class="loading" style="color: red;">تعذر تحميل البيانات، تأكد من الاتصال.</div>';
        }
    }

    function parseCSV(text) {
        const lines = text.split('\n');
        allArtisans = [];
        for (let i = 1; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            let row = line.split(',');
            if (row.length >= 4) {
                allArtisans.push({
                    name: row[0]?.replace(/^["']|["']$/g, '').trim() || '',
                    craft: row[1]?.replace(/^["']|["']$/g, '').trim() || '',
                    city: row[2]?.replace(/^["']|["']$/g, '').trim() || '',
                    phone: row[3]?.replace(/^["']|["']$/g, '').trim() || ''
                });
            }
        }
        displayArtisans(allArtisans);
    }

    function displayArtisans(artisans) {
        const container = document.getElementById('artisansList');
        container.innerHTML = '';

        if (artisans.length === 0) {
            container.innerHTML = '<div class="loading">لا يوجد حرفيون مسجلون حالياً.</div>';
            return;
        }

        artisans.forEach(artisan => {
            let card = document.createElement('div');
            card.className = 'artisan-card';
            
            card.innerHTML = `
                <span class="badge-city">${artisan.city}</span>
                <h3 class="artisan-name">${artisan.name}</h3>
                <div class="artisan-craft">التخصص: ${artisan.craft}</div>
                <div class="card-actions">
                    <a href="tel:${artisan.phone}" class="action-btn call-btn">اتصال مباشر (${artisan.phone})</a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function showRegisterForm() {
        document.getElementById('registerSection').style.display = 'block';
        document.getElementById('directorySection').style.display = 'none';
    }

    function showDirectory() {
        document.getElementById('registerSection').style.display = 'none';
        document.getElementById('directorySection').style.display = 'block';
    }

    // إرسال البيانات بدون واتساب
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري الإرسال...';

        const formData = new FormData(this);

        fetch(this.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        })
        .then(response => {
            if (response.ok) {
                alert('تم تسجيل البيانات بنجاح!');
                this.reset();
                showDirectory();
            } else {
                alert('حدث خطأ، يرجى المحاولة مرة أخرى.');
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'إرسال وتسجيل البيانات';
        })
        .catch(error => {
            alert('حدث خطأ في الاتصال.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'إرسال وتسجيل البيانات';
        });
    });

    function filterArtisans() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allArtisans.filter(artisan => {
            let text = (artisan.name + " " + artisan.craft + " " + artisan.city + " " + artisan.phone).toLowerCase();
            return text.includes(input);
        });
        displayArtisans(filtered);
    }
</script>

</body>
</html>
