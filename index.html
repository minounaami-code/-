<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #121212; color: #fff; text-align: center; font-family: sans-serif; padding: 20px; }
        input { width: 80%; padding: 10px; margin: 10px; border-radius: 5px; }
        button { padding: 10px 20px; background: #e50914; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        video { width: 100%; max-width: 600px; margin-top: 20px; background: #000; }
    </style>
</head>
<body>
    <h1>IPTV Player</h1>
    <input type="text" id="stream-url" placeholder="ضع رابط القناة هنا...">
    <br>
    <button onclick="playVideo()">تشغيل</button>
    <br>
    <video id="video" controls></video>

    <script>
        function playVideo() {
            var video = document.getElementById('video');
            var url = document.getElementById('stream-url').value;
            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                video.play();
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }
    </script>
</body>
</html>
