<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة خدماتك - دليل الحرفيين والورشات</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; direction: rtl; text-align: right; }
        .header { background: #3700b3; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .search-box { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 20px; }
        .artisan-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .badge-city { background: #ede7f6; color: #5e35b1; padding: 4px 10px; border-radius: 12px; font-size: 12px; display: inline-block; margin-bottom: 8px; }
        .artisan-name { font-size: 18px; font-weight: bold; color: #333; margin: 0 0 5px 0; }
        .artisan-craft { color: #666; font-size: 14px; margin-bottom: 12px; }
        .card-actions { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; text-align: center; text-decoration: none; font-size: 14px; font-weight: bold; display: inline-block; }
        .whatsapp-btn { background-color: #e8f5e9; color: #2e7d32; }
        .call-btn { background-color: #e3f2fd; color: #1565c0; }
        .loading { text-align: center; color: #666; padding: 20px; font-size: 16px; }
    </style>
</head>
<body>

<div class="header">
    <h1>منصة خدماتك</h1>
    <p style="margin: 5px 0 0; font-size: 13px;">دليل الحرفيين والورشات</p>
</div>

<div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم الحرفي أو التخصص أو المدينة..." onkeyup="filterArtisans()">
    <div id="artisansList">
        <div class="loading">جاري تحميل البيانات من الجدول...</div>
    </div>
</div>

<script>
    // رابط جدول البيانات الخاص بك
    const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/1-9DHkXXgWj7QxVfI5gi4jdaZkT6FU-IhVpUn2-ih4xc/export?format=csv';
    
    let allArtisans = [];

    async function fetchSheetData() {
        try {
            const response = await fetch(sheetCSVUrl);
            const data = await response.text();
            parseCSV(data);
        } catch (error) {
            document.getElementById('artisansList').innerHTML = '<div style="text-align:center; color:red; padding:20px;">عذراً، حدث خطأ في تحميل البيانات.</div>';
        }
    }

    function parseCSV(text) {
        const lines = text.split('\n');
        allArtisans = [];
        
        // نبدأ من الخط الثاني لتجاوز أسماء الأعمدة (Header)
        for (let i = 1; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            
            // تقسيم السطر حسب الفواصل (مع مراعاة العلامات التنصيصية البسيطة)
            let row = line.split(',');
            if (row.length >= 4) {
                allArtisans.push({
                    name: row[0]?.replace(/^["']|["']$/g, '').trim() || '',
                    craft: row[1]?.replace(/^["']|["']$/g, '').trim() || '',
                    city: row[2]?.replace(/^["']|["']$/g, '').trim() || '',
                    phone: row[3]?.replace(/^["']|["']$/g, '').trim() || ''
                });
            }
        }
        displayArtisans(allArtisans);
    }

    function displayArtisans(data) {
        const container = document.getElementById('artisansList');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">لا توجد نتائج مطابقة.</div>';
            return;
        }

        data.forEach(item => {
            let card = document.createElement('div');
            card.className = 'artisan-card';
            let cleanPhone = item.phone.replace(/^0/, '');
            card.innerHTML = `
                <span class="badge-city">${item.city}</span>
                <h3 class="artisan-name">${item.name}</h3>
                <div class="artisan-craft">التخصص: ${item.craft}</div>
                <div class="card-actions">
                    <a href="https://wa.me/213${cleanPhone}" class="action-btn whatsapp-btn" target="_blank">واتساب</a>
                    <a href="tel:${item.phone}" class="action-btn call-btn">اتصال</a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterArtisans() {
        let val = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allArtisans.filter(item => {
            let text = (item.name + " " + item.craft + " " + item.city + " " + item.phone).toLowerCase();
            return text.includes(val);
        });
        displayArtisans(filtered);
    }

    // جلب البيانات أول ما يفتح الموقع
    fetchSheetData();
</script>

</body>
</html>
