<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة خدماتك - دليل الحرفيين</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; direction: rtl; text-align: right; }
        .header { background: #3700b3; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .search-box { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 20px; }
        .artisan-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .badge-city { background: #ede7f6; color: #5e35b1; padding: 4px 10px; border-radius: 12px; font-size: 12px; display: inline-block; margin-bottom: 8px; }
        .artisan-name { font-size: 18px; font-weight: bold; color: #333; margin: 0 0 5px 0; }
        .artisan-craft { color: #666; font-size: 14px; margin-bottom: 12px; }
        .card-actions { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 10px; border-radius: 8px; text-align: center; text-decoration: none; font-size: 14px; font-weight: bold; display: inline-block; }
        .whatsapp-btn { background-color: #e8f5e9; color: #2e7d32; }
        .call-btn { background-color: #e3f2fd; color: #1565c0; }
        .loading { text-align: center; color: #666; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>منصة خدماتك</h1>
    <p style="margin: 5px 0 0; font-size: 13px;">دليل الحرفيين والورشات</p>
</div>

<div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم الحرفي أو التخصص أو المدينة..." onkeyup="filterArtisans()">
    <div id="artisansList">
        <div class="loading">جاري تحميل الحرفيين...</div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxKkMKS4PH06dhVu_VLQG8IrY73lCs_vw39Jz1ErbKyhVoEf3067xlt2sy2PZqgG0qB/exec';
    let allArtisans = [];

    window.onload = function() {
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                allArtisans = data;
                displayArtisans(allArtisans);
            })
            .catch(err => {
                document.getElementById('artisansList').innerHTML = '<div class="loading" style="color:red;">عذراً، حدث خطأ في تحميل البيانات.</div>';
            });
    };

    function displayArtisans(artisans) {
        const container = document.getElementById('artisansList');
        container.innerHTML = '';

        if (!artisans || artisans.length === 0) {
            container.innerHTML = '<div class="loading">لا توجد نتائج مطابقة حالياً.</div>';
            return;
        }

        artisans.slice().reverse().forEach(item => {
            // سحب البيانات بمرونة تامة بغض النظر عن أسماء الأعمدة
            let name = item.name || item.A || Object.values(item)[0] || 'حرفي معتمد';
            let craft = item.craft || item.B || Object.values(item)[1] || 'خدمات عامة';
            let city = item.city || item.C || Object.values(item)[2] || 'بسكرة';
            let phone = item.phone || item.D || Object.values(item)[3] || '';

            let card = document.createElement('div');
            card.className = 'artisan-card';
            card.innerHTML = `
                <span class="badge-city">${city}</span>
                <h3 class="artisan-name">${name}</h3>
                <div class="artisan-craft">التخصص: ${craft}</div>
                <div class="card-actions">
                    <a href="https://wa.me/213${phone.toString().replace(/^['=]/, '').replace(/^0/, '')}" class="action-btn whatsapp-btn" target="_blank">واتساب</a>
                    <a href="tel:${phone}" class="action-btn call-btn">اتصال</a>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterArtisans() {
        let val = document.getElementById('searchInput').value.toLowerCase();
        let filtered = allArtisans.filter(item => {
            let rowText = Object.values(item).join(' ').toLowerCase();
            return rowText.includes(val);
        });
        displayArtisans(filtered);
    }
</script>

</body>
</html>
